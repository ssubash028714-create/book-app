<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Book Details</title>

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    l;
    display:flex;

    color:#e91e63;
    font-weight:bold;
    margin-bottom:10px;
}

.description{
    font-size:15px;
    color:#333;
    line-height:1.6;
}

button{
    margin-top:20px;
    padding:10px 20px;
    border:none;
    background:#764ba2;
    color:e;
    border-radius:8px;
    cursor:pointer;
    font-size:15px;
}

button:hover{
    background:#5a3d91;
}

@keyframes fadeIn{
    from{opacity:0; transform:translateY(20px);}
    to{opacity:1; transform:translateY(0);}
}
</style>

</head>
<body>

<div class="card">

<img id="bookImage" class="book-image">

<div class="details">
<h2 id="bookName"></h2>
<p class="author" id="author"></p>
<p class="rating" id="rating"></p>
<p class="price" id="price"></p>

<button onclick="goBack()">⬅ Back</button>
</div>

</div>

<script>

"பார்த்திபன் கனவு":{

const selectedBook = localStorage.getItem("selectedBook");
const book = books[selectedBook];

if(book){
document.getElementById("bookName").innerText = selectedBook;
document.getElementById("author").innerText = "✍ Author: " + book.author;
document.getElementById("rating").innerText = book.rating;
document.getElementById("price").innerText = "💰 Price: " + book.price;
document.getElementById("description").innerText = book.description;
document.getElementById("bookImage").src = book.image;
}

function goBack(){
window.location.href="book.html";
}

</script>

</body>
</html>
